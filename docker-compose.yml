services:
  db:
    image: ankane/pgvector:latest
    container_name: ai_recruitment_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgrel
      POSTGRES_PASSWORD: ben123
      POSTGRES_DB: AI_Screening
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ai_network

  backend:
    build:
      context: ./backend
    image: ai-recruitment-backend:v1
    container_name: resume_backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - db
    networks:
      - ai_network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: ai_n8n_resume
    ports:
      - "5688:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5688/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_CORS_ALLOWED_ORIGINS=http://localhost:3001,http://localhost:3000
      - N8N_OPTIONS_RESPONSE_HEADERS=Access-Control-Allow-Origin:*,Access-Control-Allow-Methods:POST,GET,OPTIONS,Access-Control-Allow-Headers:Content-Type
    volumes:
      - ai_resume_n8n_data:/home/node/.n8n
    depends_on:
      - backend
    networks:
      - ai_network

  frontend:
    build:
      context: ./frontend
    container_name: resume_frontend
    ports:
      - "3001:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge

volumes:
  pgdata:
  ai_resume_n8n_data: